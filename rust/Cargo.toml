[workspace]
resolver = "2"
members = [
    "crates/nps-proto",
    "crates/nps-legacy",
    "crates/nps-server",
    "crates/nps-web",
    "crates/nps-app",
    "crates/nps-client",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.100"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
anyhow = "1"
thiserror = "1"
md-5 = "0.10"
hex = "0.4"
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
lto = true
strip = true
codegen-units = 1
